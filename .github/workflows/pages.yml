name: CI and Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # A CatCard release can ask for a rebuild directly (event type "catcard-release").
  repository_dispatch:
    types: [catcard-release]
  # Otherwise, look for new releases every hour; the build only runs when they changed.
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # On a schedule, compare the releases on GitHub with the mirror that is deployed.
  releases:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.cmp.outputs.stale }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'schedule'
      - uses: actions/setup-node@v7
        if: github.event_name == 'schedule'
        with:
          node-version: 24
      - id: cmp
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          want=$(node scripts/fetch-firmware.mjs --fingerprint)
          have=$(curl -sf "${SITE}firmware/index.json" | jq -r .fingerprint || true)
          echo "releases: $want, deployed: $have"
          [ "$want" = "$have" ] && echo "stale=false" >> "$GITHUB_OUTPUT" || echo "stale=true" >> "$GITHUB_OUTPUT"

  build:
    needs: releases
    if: needs.releases.outputs.stale == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Mirror CatCard release images
        run: npm run firmware
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run build
        env:
          # Project pages live under /<repo>/.
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
